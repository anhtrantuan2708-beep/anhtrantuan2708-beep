name: Update profile art

# Refreshes the contribution graph + animated README card SVGs daily from real data.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scrape real contribution data (no auth needed)
        env:
          GH_PROFILE_USER: anhtrantuan2708-beep
        run: python scripts/fetch_contributions.py

      - name: Render README cards (hero, tiles, activity, repos, blue graph)
        run: python scripts/render_readme_cards.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh README SVG cards [skip ci]"
          file_pattern: "data/contributions.json cards/*.svg"
