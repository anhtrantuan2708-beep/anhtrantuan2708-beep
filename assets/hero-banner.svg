<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D13"/>
      <stop offset="55%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#0E1726"/>
    </linearGradient>
    <radialGradient id="glow1" cx="82%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0B0D13" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="18%" cy="88%" r="42%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B0D13" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow2)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Top Pill Badge -->
  <g transform="translate(64, 52)">
    <rect x="0" y="0" width="318" height="30" rx="15" fill="#1E293B" fill-opacity="0.75" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="16" cy="15" r="4.5" fill="#2DD4BF"/>
    <text x="30" y="19.5" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="0.6">
      OPEN TO UX/UI &amp; PRODUCT DESIGN ROLES
    </text>
  </g>

  <!-- Main Heading -->
  <text x="64" y="138" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="700" letter-spacing="-0.8">
    Tran Tuan Anh <tspan fill="#94A3B8" font-weight="400" font-size="34">(Brian)</tspan>
  </text>

  <!-- Subtitle -->
  <text x="64" y="180" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="21" font-weight="600" letter-spacing="-0.2">
    UX/UI Designer &amp; Product-Minded Frontend Builder
  </text>

  <!-- Description -->
  <text x="64" y="218" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="15.5" font-weight="400">
    Designing &amp; shipping interactive web experiences, mobile interfaces, and native macOS utilities
  </text>
  <text x="64" y="242" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="15.5" font-weight="400">
    with high-craft motion, clean component systems, and real code execution.
  </text>

  <!-- Bottom Meta Row -->
  <g transform="translate(64, 268)" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13.5" font-weight="500">
    <text x="0" y="14">📍 Ho Chi Minh City, Vietnam</text>
    <text x="220" y="14" fill="#475569">•</text>
    <text x="238" y="14">🎓 B.Eng. in Software Engineering (Van Lang University)</text>
    <text x="615" y="14" fill="#475569">•</text>
    <text x="633" y="14" fill="#38BDF8">portfolio-bryan-2708.framer.website ↗</text>
  </g>

  <!-- Right Decorative UI Card Stack -->
  <g transform="translate(870, 56)">
    <rect x="24" y="24" width="248" height="184" rx="14" fill="#0F172A" fill-opacity="0.7" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    <rect x="0" y="0" width="256" height="192" rx="14" fill="#131C2E" fill-opacity="0.92" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.2"/>
    <!-- Window Dots -->
    <circle cx="20" cy="20" r="4.5" fill="#F43F5E" fill-opacity="0.8"/>
    <circle cx="34" cy="20" r="4.5" fill="#F59E0B" fill-opacity="0.8"/>
    <circle cx="48" cy="20" r="4.5" fill="#10B981" fill-opacity="0.8"/>
    <text x="70" y="24" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">craft.config.ts</text>
    <line x1="0" y1="36" x2="256" y2="36" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <!-- Code Lines -->
    <g transform="translate(20, 58)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="0" y="0" fill="#818CF8">const</text>
      <text x="42" y="0" fill="#F8FAFC">focus</text>
      <text x="84" y="0" fill="#38BDF8">=</text>
      <text x="98" y="0" fill="#94A3B8">{</text>
      <text x="14" y="22" fill="#CBD5E1">system:</text>
      <text x="72" y="22" fill="#2DD4BF">'Figma → Code'</text><text x="174" y="22" fill="#64748B">,</text>
      <text x="14" y="44" fill="#CBD5E1">motion:</text>
      <text x="72" y="44" fill="#38BDF8">'60fps Spring'</text><text x="174" y="44" fill="#64748B">,</text>
      <text x="14" y="66" fill="#CBD5E1">platforms:</text>
      <text x="92" y="66" fill="#FDE047">['Web', 'iOS', 'macOS']</text>
      <text x="0" y="88" fill="#94A3B8">};</text>
      <rect x="0" y="104" width="216" height="6" rx="3" fill="url(#accent)" fill-opacity="0.85"/>
    </g>
  </g>
</svg>
